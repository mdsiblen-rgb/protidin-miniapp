<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Protidiner Kaj BD - A to Z</title>
<style>
:root{--bg:#0f0f1e;--card:#1a1a2e;--card2:#252542;--purple:#8b5cf6;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--text:#fff;--muted:#9ca3af}
*{box-sizing:border-box;font-family: 'Hind Siliguri',system-ui}
body{margin:0;background:var(--bg);color:var(--text);padding:12px}
h1{text-align:center;color:var(--purple);font-size:22px;margin:10px 0}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid #2d2d4d;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h2{margin:0 0 12px;font-size:17px;color:var(--green)}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
input,textarea{width:100%;background:#0f0f1e;border:1px solid #333;padding:10px 12px;border-radius:10px;color:#fff;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{border:none;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;width:100%;margin-top:8px}
.btn-green{background:var(--green);color:#000}
.btn-orange{background:var(--orange);color:#000}
.btn-purple{background:var(--purple);color:#fff}
.btn-red{background:var(--red);color:#fff}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.top-actions button{width:auto}
</style>
</head>
<body>
<h1>👑 Admin Panel - A to Z Control - ভরপুর</h1>
<p style="text-align:center;color:var(--muted);font-size:12px;margin:0">এখান থেকে সব চেঞ্জ করলে মেইন অ্যাপে অটো আপডেট হবে</p>

<div class="top-actions">
<button class="btn btn-green" style="width:auto" onclick="loadConfig()">🔄 Load Current Config</button>
<button class="btn btn-orange" style="width:auto" onclick="saveAll()">💾 Save All - ভরপুর সেভ</button>
<button class="btn btn-red" style="width:auto" onclick="resetDefault()">♻️ Reset Default</button>
</div>

<!-- LINK CONTROL -->
<div class="card">
<h2>🔗 লিংক কন্ট্রোল - ভরপুর</h2>
<label>Telegram Link</label><input id="tg_link" value="https://t.me/ProtidinerKajBD">
<label>YouTube Link</label><input id="yt_link" value="https://www.youtube.com/@MdSible-k7o">
<label>Refer Base Link</label><input id="ref_base" value="https://t.me/ProtidinMiniAppBot?start=">
<div class="grid2">
<div><label>Company Ad Zone ID (11764581)</label><input id="zone_c" value="11764581"></div>
<div><label>Popup Ad Zone ID (11798857)</label><input id="zone_p" value="11798857"></div>
</div>
</div>

<!-- TAKA -->
<div class="card">
<h2>💸 টাকার পরিমাণ - ভরপুর</h2>
<div class="grid2">
<div><label>Company Ad ৳</label><input id="t_company" type="number" value="0.25"></div>
<div><label>Popup Ad ৳</label><input id="t_popup" type="number" value="0.2"></div>
<div><label>Visit Company Task ৳</label><input id="t_visit" type="number" value="20"></div>
<div><label>Check-in ৳</label><input id="t_checkin" type="number" value="10"></div>
<div><label>Telegram Join ৳</label><input id="t_tg" type="number" value="10"></div>
<div><label>YouTube Join ৳</label><input id="t_yt" type="number" value="10"></div>
<div><label>Refer Bonus ৳</label><input id="t_refer" type="number" value="20"></div>
<div><label>Spin Bonus Min ৳ (Diamond হিসাবে)</label><input id="t_spin" value="Diamond only"></div>
</div>
<label>Withdraw Min ৳</label><input id="t_withdraw" type="number" value="500">
<label>60 Ads Bonus ৳</label><input id="t_60ads" type="number" value="200">
</div>

<!-- DIAMOND -->
<div class="card">
<h2>💎 ডায়মন্ড কন্ট্রোল</h2>
<div class="grid2">
<div><label>Telegram Diamond</label><input id="d_tg" type="number" value="10"></div>
<div><label>YouTube Diamond</label><input id="d_yt" type="number" value="10"></div>
<div><label>Company Ad Diamond (প্রতি Ad)</label><input id="d_company" type="number" value="1"></div>
<div><label>Popup Ad Diamond</label><input id="d_popup" type="number" value="1"></div>
</div>
<label>Spin Rewards (5,10,20,30,50,100)</label><input id="spin_rewards" value="5,10,20,30,50,100">
</div>

<!-- TEXT -->
<div class="card">
<h2>📦 বক্সের লেখা - ভরপুর</h2>
<label>Home Biggest Offer Text</label><textarea id="home_offer" rows="3">30+30=60 Ad = ৳200 Bonus | সব বাটন কাজ করে | সব লিংক কাজ করে</textarea>
<label>Support Admin Notice</label><textarea id="support_notice" rows="3">Support 10AM-10PM | t.me/ProtidinerKajBD | Min 500 | 12h Reset</textarea>
<label>Refer Top Text</label><input id="refer_top" value="৳20 Instant + 15% Lifetime">
<label>Level Names (0-100,100-300,300-500,500+)</label><input id="level_names" value="Bronze,Silver,Gold,Diamond VIP">
</div>

<!-- LEVEL -->
<div class="card">
<h2>🎯 Level & Progress - ভরপুর</h2>
<div class="grid3">
<div><label>Bronze Max</label><input id="bronze_max" type="number" value="100"></div>
<div><label>Silver Max</label><input id="silver_max" type="number" value="300"></div>
<div><label>Gold Max</label><input id="gold_max" type="number" value="500"></div>
</div>
<label>Default Balance ৳</label><input id="def_balance" type="number" value="700.55">
<label>Default Diamond</label><input id="def_diamond" type="number" value="1231">
<label>Default Ads Count</label><input id="def_ads" type="number" value="17">
</div>

<!-- EXPORT IMPORT -->
<div class="card" style="border:2px dashed var(--green)">
<h2>📤 Export / Import - ভরপুর</h2>
<textarea id="json_box" rows="8" placeholder='{"tg_link":...}'></textarea>
<div class="grid2">
<button class="btn btn-purple" onclick="exportJSON()">📋 Export JSON</button>
<button class="btn btn-green" onclick="importJSON()">📥 Import JSON</button>
</div>
<p style="color:var(--muted);font-size:11px;margin-top:8px">এই JSON কপি করে রাখলে পরে যেকোন সময় Restore করতে পারবে</p>
</div>

<script>
const KEYS = ["tg_link","yt_link","ref_base","zone_c","zone_p","t_company","t_popup","t_visit","t_checkin","t_tg","t_yt","t_refer","t_spin","t_withdraw","t_60ads","d_tg","d_yt","d_company","d_popup","spin_rewards","home_offer","support_notice","refer_top","level_names","bronze_max","silver_max","gold_max","def_balance","def_diamond","def_ads"];
function saveAll(){
 let cfg={}; KEYS.forEach(k=>{cfg[k]=document.getElementById(k).value});
 localStorage.setItem("protidin_config", JSON.stringify(cfg));
 document.getElementById("json_box").value=JSON.stringify(cfg,null,2);
 alert("✅ ভরপুর সেভ হয়ে গেছে জান! LocalStorage এ সেভ!");
}
function loadConfig(){
 let s=localStorage.getItem("protidin_config");
 if(!s){alert("কোন সেভ করা Config নাই!");return;}
 let cfg=JSON.parse(s); KEYS.forEach(k=>{if(cfg[k]!==undefined) document.getElementById(k).value=cfg[k]});
 document.getElementById("json_box").value=JSON.stringify(cfg,null,2);
 alert("✅ Load হয়ে গেছে!");
}
function exportJSON(){
 let cfg={}; KEYS.forEach(k=>{cfg[k]=document.getElementById(k).value});
 document.getElementById("json_box").value=JSON.stringify(cfg,null,2);
 navigator.clipboard.writeText(document.getElementById("json_box").value);
 alert("📋 JSON Copy হয়ে গেছে!");
}
function importJSON(){
 try{
  let cfg=JSON.parse(document.getElementById("json_box").value);
  KEYS.forEach(k=>{if(cfg[k]!==undefined) document.getElementById(k).value=cfg[k]});
  saveAll();
  alert("✅ Import সফল!");
 }catch(e){alert("❌ JSON ভুল আছে: "+e.message)}
}
function resetDefault(){if(confirm("Reset করবে জান?")){localStorage.removeItem("protidin_config"); location.reload();}}
</script>
</body>
</html>
