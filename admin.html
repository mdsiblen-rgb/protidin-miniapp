<!-- === SEPARATE ADMIN PANEL BOX - FINAL PRO - 5x VERIFY + BOT ADMIN === -->
<div id="p-admin" class="page">
  <div class="glass" style="border:2px solid #7C5CFF">
    <b>🔐 Admin Panel - Final Pro (Boss) - 2 Way Open</b>
    
    <label>Telegram Channel Link</label><input id="aTg" class="adminInput">
    <label>YouTube Channel Link</label><input id="aYt" class="adminInput">
    <label style="color:#22c55e">Company Visit Direct Link</label><input id="aDirect" class="adminInput">
    <label style="color:#22c55e">Company Ads Zone ID</label><input id="aZoneC" class="adminInput">
    <label style="color:#FF9F0A">Popup / Bonus Zone ID</label><input id="aZoneP" class="adminInput">
    <hr style="margin:10px 0;border-color:#252B4A">
    <label>Company Rate</label><input id="aCR" class="adminInput" type="number" step="0.01">
    <label>Popup Rate</label><input id="aPR" class="adminInput" type="number" step="0.01">
    <label>Min Withdraw (500)</label><input id="aMin" class="adminInput" type="number">
    <label>Refer Bonus</label><input id="aRef" class="adminInput" type="number">
    <label>Refer Head</label><input id="aHead" class="adminInput">
    <label>Notice</label><textarea id="aNotice" class="adminInput"></textarea>
    <label>Home Big Box</label><textarea id="aAd" class="adminInput" style="height:80px"></textarea>
    <label>Support Big Box</label><textarea id="aSupport" class="adminInput" style="height:80px"></textarea>
    <label>Refer Big Box</label><textarea id="aReferBox" class="adminInput" style="height:80px"></textarea>
    <label>Profile Big Box</label><textarea id="aProfile" class="adminInput" style="height:80px"></textarea>
    <label>Spin Rewards</label><input id="aSpin" class="adminInput">
    <label>Welcome Tk</label><input id="aWelTk" class="adminInput" type="number">
    <label>Welcome Diamond</label><input id="aWelDm" class="adminInput" type="number">
    <label>Today Paid</label><input id="aToday" class="adminInput">
    <label>Total Paid</label><input id="aTotal" class="adminInput">
    <label>Total Joined</label><input id="aJoin" class="adminInput" type="number">
    <button class="btn" style="background:#22c55e;margin-top:10px" onclick="saveA()">Save All Config</button>
  </div>

  <div class="glass" style="border:2px solid #22c55e">
    <b>💸 Withdraw Requests - Boss Control</b>
    <button class="btn" style="margin-top:8px;background:#0E122A;border:1px solid #22c55e" onclick="loadWithdraws()">🔄 Load Withdraw Requests</button>
    <div id="withdrawList" style="margin-top:10px"><small style="color:#8B90B8">Load এ ক্লিক করুন</small></div>
  </div>

  <div class="glass" style="border:2px solid #FF9F0A">
    <b>👥 All Users - Balance / Refer Control</b>
    <button class="btn" style="margin-top:8px;background:#0E122A;border:1px solid #FF9F0A" onclick="loadAllUsers()">🔄 Load All Users</button>
    <div id="allUsersList" style="margin-top:10px"><small style="color:#8B90B8">Load এ ক্লিক করুন</small></div>
  </div>
  
  <div class="glass">
    <button class="btn" style="background:#FF3B30;margin-top:8px" onclick="resetAll()">Reset All to 0</button>
    <button class="btn" style="background:#2A2E4A;margin-top:8px" onclick="openP('profile')">Back to Profile</button>
  </div>
</div>

<script>
// === ADMIN BOX LOGIC - 2 WAY ===
let cl=0,lastTap=0;
document.getElementById('vBox').addEventListener('click',()=>{
  let now=Date.now();
  if(now-lastTap>3000) cl=0;
  lastTap=now; cl++;
  if(cl>=5){
    let pass=prompt("🔐 Enter Admin Password:");
    if(pass==="653598"){ openA(); }
    else if(pass!==null){ alert("❌ Wrong Password!"); }
    cl=0;
  }
});

// BOT ADMIN ?admin=653598 দিয়ে খুলবে
if(window.location.href.includes('admin=653598')){
  setTimeout(()=>{ openA(); }, 800);
}

function openA(){
  openP('admin');
  aTg.value=cfg.tg; aYt.value=cfg.yt; aCR.value=cfg.cRate; aPR.value=cfg.pRate;
  aMin.value=cfg.min; aRef.value=cfg.refBonus; aHead.value=cfg.referHead;
  aNotice.value=cfg.notice; aAd.value=cfg.bigAd; aSupport.value=cfg.supportBox;
  aReferBox.value=cfg.referBox; aProfile.value=cfg.profileBox;
  aSpin.value=(cfg.spinRewards||[5,10,15,20,50,100]).join(',');
  aWelTk.value=cfg.welcomeTk; aWelDm.value=cfg.welcomeDm;
  aToday.value=cfg.today; aTotal.value=cfg.total; aJoin.value=cfg.join;
  aDirect.value=cfg.direct; aZoneC.value=cfg.zoneC; aZoneP.value=cfg.zoneP;
}
</script>
