<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - প্রতিদিনের কাজ বিডি</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#0A0D1E;color:#fff;max-width:500px;margin:auto;padding:20px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #2A335E;background:#161C36;color:#fff;margin:6px 0 12px}
label{font-size:13px;color:#94a3b8}h2{margin:20px 0 10px;color:#7C5CFF}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:#7C5CFF;color:#fff;font-weight:800;font-size:16px;margin-top:10px}
.glass{background:#161C36;border:1px solid #2A335E;border-radius:14px;padding:14px;margin-bottom:14px}</style>
</head><body>
<h1>👑 Admin Panel</h1><p style="color:#22c55e;font-size:13px">এখানে যা লিখবা, এপ্সে সাথে সাথে চেঞ্জ হবে</p>

<div class="glass"><h2>💰 টাকা ও লিমিট</h2>
<label>Company Ad দাম</label><input id="ad" value="0.25">
<label>Popup Ad দাম</label><input id="pop" value="0.20">
<label>Min Withdraw</label><input id="min" value="500">
<label>Company Ad Link 1</label><input id="link1" value="https://omg10.com/4/11760259">
<label>Company Ad Link 2</label><input id="link2" value="https://omg10.com/4/11760264">
</div>

<div class="glass"><h2>🏠 Home Page</h2>
<label>App Name</label><input id="app_name" value="প্রতিদিনের কাজ বিডি">
<label>Biggest Offer Title</label><input id="spon_title" value="Biggest Earning Offer">
<label>Biggest Offer Desc</label><textarea id="spon_desc">প্রতিদিন কাজ করে আয় করুন, বড় বোনাস নিন</textarea>
<label>Offer Button Text</label><input id="spon_btn" value="🚀 Claim Now">
<label>Offer Link</label><input id="spon_link" value="https://google.com">
</div>

<div class="glass"><h2>🎯 Tasks Page</h2>
<label>Tasks Title</label><input id="task_page_title" value="Tasks & Company Links">
<label>Tasks Sub</label><input id="task_page_sub" value="প্রতি Task এ ৳20-25 + Diamond">
<label>Bottom Box Title</label><input id="task_bottom_title" value="🔥 Special Offer">
<label>Bottom Box Desc</label><input id="task_bottom_desc" value="এই বক্স Admin থেকে চেঞ্জ হবে">
</div>

<div class="glass"><h2>👥 Refer Page</h2>
<label>Refer Banner</label><input id="ref_banner" value="🎉 Refer Contest চলছে! - ৳5000 পুরস্কার">
<label>Refer Rules</label><textarea id="ref_rules">1. বন্ধুকে লিংক শেয়ার করো
2. বন্ধু Join করলে ৳20 পাবে
3. বন্ধু Ads দেখলে 15% Commission</textarea>
</div>

<div class="glass"><h2>💬 Support Page</h2>
<label>Support Notice</label><textarea id="sup_notice">⚠️ রাত ১০টার পর Withdraw বন্ধ থাকে
✅ সকাল ৯টার পর আবার চালু হয়
📢 Fake Account করলে ব্যান</textarea>
<label>Telegram Link</label><input id="sup_tg" value="https://t.me/dailyworkbd">
<label>WhatsApp</label><input id="sup_wa" value="https://wa.me/8801">
</div>

<button class="btn" onclick="save()">💾 Save All Settings</button>
<p id="msg" style="text-align:center;margin-top:10px;color:#22c55e"></p>

<script>
function load(){
 let s=JSON.parse(localStorage.getItem('appSettings')||'{}');
 for(let k in s){let el=document.getElementById(k);if(el)el.value=s[k];}
}
function save(){
 let obj={};
 document.querySelectorAll('input,textarea').forEach(e=>obj[e.id]=e.value);
 localStorage.setItem('appSettings',JSON.stringify(obj));
 document.getElementById('msg').innerText='✅ Saved! এখন Home Page রিফ্রেশ দাও';
}
load();
</script>
</body></html>
