<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রতিদিনের কাজ বিডি</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0B0E1C;color:#fff;max-width:430px;margin:0 auto;padding-bottom:90px}
.glass{background:#1A2040;border:1px solid #242A45;border-radius:20px;padding:16px;margin:10px 14px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;color:#fff;background:#8b5cf6;cursor:pointer}
.btn2{background:#f59e0b}
</style>
</head>
<body>
<div class="glass" style="display:flex;justify-content:space-between">
<b>প্রতিদিনের কাজ বিডি</b><span style="color:#22c55e;font-size:12px">● Online</span>
</div>

<div class="glass" style="background:linear-gradient(135deg,#1A2040,#312e81)">
<small style="color:#94a3b8">Balance</small>
<h1 id="bal" style="font-size:36px">৳138.10</h1>
<p style="color:#94a3b8;font-size:13px">Ads: <span id="ads" style="color:#fff">0</span>/30</p>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px">
<div class="glass" style="margin:0;text-align:center">
<small>Company Ads</small>
<h2 style="color:#22c55e;margin:6px 0">৳0.25</h2>
<button class="btn" onclick="watchAd('company')">▶️ Watch</button>
<p id="cTimer" style="font-size:11px;margin-top:6px;color:#22c55e"></p>
</div>
<div class="glass" style="margin:0;text-align:center">
<small>Popup Ads</small>
<h2 style="color:#f59e0b;margin:6px 0">৳0.20</h2>
<button class="btn btn2" onclick="watchAd('popup')">▶️ Watch</button>
<p id="pTimer" style="font-size:11px;margin-top:6px;color:#f59e0b"></p>
</div>
</div>

<div class="glass" style="border-color:#f59e0b">
<b>🔥 Biggest Offer</b>
<p style="font-size:12px;color:#94a3b8;margin-top:4px">প্রতিদিন 80 টা এড দেখলে বোনাস</p>
</div>

<script>
let bal = parseFloat(localStorage.getItem('bal')||'138.10');
let count = parseInt(localStorage.getItem('cCount')||'0');
document.getElementById('bal').innerText = '৳'+bal.toFixed(2);
document.getElementById('ads').innerText = count;

function watchAd(type){
 let link = type==='company' ? 'https://omg10.com/4/11760259' : 'https://omg10.com/4/11760264';
 let el = document.getElementById(type==='company' ? 'cTimer' : 'pTimer');
 if(count>=30){alert('আজকের লিমিট শেষ');return;}
 window.open(link,'_blank');
 let sec=12;
 el.innerText='⏳ '+sec+' সেকেন্ড অপেক্ষা করো...';
 let iv=setInterval(()=>{
   sec--; el.innerText='⏳ '+sec+'s...';
   if(sec<=0){
     clearInterval(iv);
     bal+=0.25; count++;
     localStorage.setItem('bal',bal);
     localStorage.setItem('cCount',count);
     document.getElementById('bal').innerText='৳'+bal.toFixed(2);
     document.getElementById('ads').innerText=count;
     el.innerText='✅ ৳0.25 যোগ হয়েছে!';
     setTimeout(()=>el.innerText='',2000);
   }
 },1000);
}
</script>
</body>
</html>
