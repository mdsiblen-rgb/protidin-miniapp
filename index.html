<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>প্রতিদিনের কাজ বিডি</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
body{background:#0B0E1C;color:#fff;max-width:430px;margin:auto;min-height:100vh;padding-bottom:90px}
.glass{background:#1A2040;border:1px solid #242A45;border-radius:14px;padding:12px}
.btn{padding:12px;border:none;border-radius:12px;font-weight:800;width:100%;color:#fff;background:linear-gradient(135deg,#8b5cf6,#6366f1);cursor:pointer}
.inputDark{width:100%;padding:10px;border-radius:8px;border:1px solid #2a2f4a;background:#0B0E1C;color:#fff;margin-top:6px}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:auto;background:#151A32;border-top:1px solid #242A45;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.bItem{text-align:center;color:#94a3b8;font-size:11px;cursor:pointer;flex:1}
.bItem.active{color:#8b5cf6}
</style>
</head>
<body>
<!-- ===== ADMIN PANEL ===== -->
<div id="adminPage" style="display:none;padding:15px">
<h2 style="text-align:center;margin:10px 0">👑 Admin Panel</h2>
<div class="glass">
<label>App Name</label><input id="a_name" class="inputDark">
<label>Company Rate</label><input id="a_cRate" class="inputDark">
<label>Popup Rate</label><input id="a_pRate" class="inputDark">
<label>Min Withdraw (৳)</label><input id="a_min" class="inputDark">
<label>Refer Bonus</label><input id="a_ref" class="inputDark">
<label>Direct Link 1</label><input id="a_l1" class="inputDark">
<label>Direct Link 2</label><input id="a_l2" class="inputDark">
<label>Telegram Link</label><input id="a_tg" class="inputDark">
<label>Big Offer Text</label><textarea id="a_offer" class="inputDark" rows="3"></textarea>
<label>Notice</label><textarea id="a_notice" class="inputDark" rows="3"></textarea>
<button class="btn" style="margin-top:12px" onclick="saveAdmin()">🚀 Save For All Users</button>
<p id="a_ok" style="display:none;color:#22c55e;text-align:center;margin-top:10px">✅ Save হয়েছে!</p>
</div>
<p style="text-align:center;margin-top:15px"><a href="./" style="color:#94a3b8">← User App এ ফিরে যাও</a></p>
</div>

<!-- ===== USER APP ===== -->
<div id="userPage">
<div style="padding:15px">
<div class="glass" style="display:flex;justify-content:space-between;align-items:center">
<b id="appName">প্রতিদিনের কাজ বিডি</b><span style="font-size:12px;color:#22c55e">● Online</span>
</div>
<div class="glass" style="margin-top:10px;background:linear-gradient(135deg,#1A2040,#2a2f6a)">
<p style="font-size:12px;color:#94a3b8">Balance</p><h1 id="bal">৳0.00</h1>
<p style="font-size:12px;margin-top:6px">Today Ads: <b id="ads">0</b> | Refer: <b id="refCount">0</b></p>
</div>
<div id="bigBox" class="glass" style="margin-top:10px;border-color:#8b5cf6"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div class="glass" style="text-align:center"><small>Company Ads Rate</small><h3 id="cRate" style="color:#22c55e">৳0.25</h3><button class="btn" style="margin-top:8px;padding:8px" onclick="watchAd('company')">▶️ Watch</button></div>
<div class="glass" style="text-align:center"><small>Popup Rate</small><h3 id="pRate" style="color:#f59e0b">৳0.20</h3><button class="btn" style="margin-top:8px;padding:8px;background:linear-gradient(135deg,#f59e0b,#f97316)" onclick="watchAd('popup')">▶️ Watch</button></div>
</div>
<div id="vipBox" class="glass" style="margin-top:10px"></div>
<div id="noticeBox" class="glass" style="margin-top:10px"></div>
<div class="glass" style="margin-top:10px"><b>Withdraw (Min <span id="minW">৳500</span>)</b><input id="wAmount" class="inputDark" placeholder="Amount"><input id="wMethod" class="inputDark" placeholder="Bkash/Nagad Number" style="margin-top:8px"><button class="btn" style="margin-top:8px" onclick="withdraw()">Withdraw Request</button></div>
</div>
<div class="bottom">
<div class="bItem active">🏠<br>Home</div>
<div class="bItem">🎯<br>Tasks</div>
<div class="bItem">👥<br>Refer</div>
<div class="bItem">💬<br>Support</div>
<div class="bItem">👤<br>Profile</div>
</div>
</div>

<script>
// ===== FIREBASE CONFIG - তোমারটা বসাও =====
const firebaseConfig = {
  apiKey: "AIzaSyDummyKey-Replace-With-Yours",
  authDomain: "protidin-kaj-bd.firebaseapp.com",
  databaseURL: "https://protidin-kaj-bd-default-rtdb.firebaseio.com",
  projectId: "protidin-kaj-bd",
  storageBucket: "protidin-kaj-bd.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456:web:abcdef"
};
// ==========================================
let defaultAdmin = {
  appName:"প্রতিদিনের কাজ বিডি", companyRate:0.25, popupRate:0.20, minWithdraw:500, referBonus:20,
  directLink1:"https://omg10.com/4/11760259", directLink2:"https://omg10.com/4/11760264",
  telegramLink:"https://t.me/ProtidinerKaj_BD",
  bigOffer:"🔥 Biggest Offer - 80 Ads = ৳500 Bonus",
  notice:"⚠️ রাত ১০টার পর Withdraw বন্ধ",
  vipText:"<b>💎 VIP</b><p>VIP হলে বেশি ইনকাম</p>"
};
let ADMIN = {...defaultAdmin};
try{ firebase.initializeApp(firebaseConfig); }catch(e){}

function loadAdmin(){
  try{
    firebase.database().ref('config').on('value', snap=>{
      if(snap.val()){ ADMIN = {...defaultAdmin, ...snap.val()}; renderAll(); if(isAdmin) fillAdminForm(); }
    });
  }catch(e){ renderAll(); }
}
function renderAll(){
  document.getElementById('appName').innerText=ADMIN.appName;
  document.getElementById('cRate').innerText='৳'+ADMIN.companyRate;
  document.getElementById('pRate').innerText='৳'+ADMIN.popupRate;
  document.getElementById('minW').innerText='৳'+ADMIN.minWithdraw;
  document.getElementById('bigBox').innerHTML=ADMIN.bigOffer;
  document.getElementById('noticeBox').innerHTML='<small style="color:#fbbf24">'+ADMIN.notice+'</small>';
  document.getElementById('vipBox').innerHTML=ADMIN.vipText;
}

const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'siblen123';
if(isAdmin){
  document.getElementById('userPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
}
function fillAdminForm(){
  a_name.value=ADMIN.appName; a_cRate.value=ADMIN.companyRate; a_pRate.value=ADMIN.popupRate;
  a_min.value=ADMIN.minWithdraw; a_ref.value=ADMIN.referBonus; a_l1.value=ADMIN.directLink1;
  a_l2.value=ADMIN.directLink2; a_tg.value=ADMIN.telegramLink; a_offer.value=ADMIN.bigOffer; a_notice.value=ADMIN.notice;
}
function saveAdmin(){
  let newCfg={
    appName:a_name.value, companyRate:parseFloat(a_cRate.value), popupRate:parseFloat(a_pRate.value),
    minWithdraw:parseInt(a_min.value), referBonus:parseInt(a_ref.value),
    directLink1:a_l1.value, directLink2:a_l2.value, telegramLink:a_tg.value,
    bigOffer:a_offer.value, notice:a_notice.value, vipText:ADMIN.vipText
  };
  firebase.database().ref('config').set(newCfg).then(()=>{
    document.getElementById('a_ok').style.display='block';
    setTimeout(()=>document.getElementById('a_ok').style.display='none',2000);
  }).catch(()=>{ localStorage.setItem('ADMIN_CFG', JSON.stringify(newCfg)); alert('Firebase Config ভুল, Local এ Save হলো'); });
}
function watchAd(t){ let url = t==='company'? ADMIN.directLink1 : ADMIN.directLink2; window.open(url,'_blank'); let b=parseFloat(localStorage.getItem('bal')||0); b+= t==='company'? ADMIN.companyRate: ADMIN.popupRate; localStorage.setItem('bal', b); document.getElementById('bal').innerText='৳'+b.toFixed(2); }
function withdraw(){ alert('Withdraw Request Sent: '+wAmount.value); }
loadAdmin();
document.getElementById('bal').innerText='৳'+(parseFloat(localStorage.getItem('bal')||0).toFixed(2));
</script>
</body>
</html>
