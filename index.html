<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রতিদিনের কাজ বিডি - FINAL V10</title>
<script src="https://richinfo.co/richpartners/pops/js/richads-pops.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#070A1A;color:#fff;max-width:430px;margin:0 auto;padding-bottom:125px}
.glass{background:#161C36;border:1px solid #2A335E;border-radius:20px;padding:16px;margin:10px 12px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:800;color:#fff;background:#7C5CFF;cursor:pointer}
.btn-o{background:#FF9F0A}.btn-g{background:#22c55e}
.page{display:none}.page.active{display:block}
.btm{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#12152B;display:flex;padding:10px 0 18px;border-radius:22px 22px 0 0;border-top:1px solid #2A335E;z-index:999}
.btm div{flex:1;text-align:center;color:#6B7280;font-size:11px;font-weight:700}.btm div.on{color:#8B5CF6}.btm div span{font-size:22px;display:block}
.input{width:100%;padding:13px;border-radius:12px;border:1px solid #2A335E;background:#0B0E1C;color:#fff;margin-top:8px}
.meth{flex:1;padding:12px;border-radius:14px;border:1px solid #2A335E;text-align:center;background:#0B0E1C;font-weight:700}.meth.on{border-color:#7C5CFF;background:rgba(124,92,255,.25)}
.level-box{height:18px;background:#0B0E1C;border-radius:100px;overflow:hidden;border:1px solid #2A335E;margin-top:10px}
.level-fill{height:100%;background:linear-gradient(90deg,#7C5CFF,#22c55e,#FF9F0A);transition:.6s}
.big-diamond{font-size:58px;filter:drop-shadow(0 0 12px #38bdf8);animation:float 2s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>

<!-- HOME PAGE - তোমার ছবির মতো -->
<div id="p-home" class="page active">
  <div class="glass" style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-weight:800;font-size:18px">👑 <span id="userName">Md Siblen</span> <span onclick="saveName()" style="cursor:pointer">✏️</span></div>
      <div style="color:#22c55e;font-size:13px;margin-top:2px">🟢 Online <span id="bal" style="color:#fff;font-weight:800">৳157.75</span></div>
    </div>
    <div style="text-align:right">
      <div style="font-size:13px;color:#94a3b8">Ads: <span id="ads">33</span>/30 | <span id="diamondTotal">265</span> Diamond</div>
      <div id="diamondBig" class="big-diamond" style="text-align:right;font-weight:900;font-size:56px;line-height:1">265</div>
    </div>
  </div>

  <div class="glass">
    <div style="display:flex;justify-content:space-between;font-weight:700"><span>💎 Diamond Company Ads</span><span>৳<span id="cPriceTxt">0.25</span> <span id="cCount">30/30</span></span></div>
    <button class="btn btn-g" style="margin-top:12px;font-size:16px" onclick="watchAd()">▶️ Start Company Ad</button>
  </div>

  <div class="glass">
    <div style="display:flex;justify-content:space-between;font-weight:700"><span>Popup Ads</span><span>৳<span id="pPriceTxt">0.2</span> <span id="pCount">30/30</span></span></div>
    <button class="btn" style="margin-top:12px;background:#8B5CF6;font-size:16px" onclick="watchAd()">▶️ Watch</button>
  </div>

  <div class="glass">
    <div style="font-weight:800">💸 Withdraw (Min ৳<span class="wMin">500</span>)</div>
    <div style="display:flex;gap:10px;margin:12px 0"><div class="meth on" onclick="selMeth(this)">bKash</div><div class="meth" onclick="selMeth(this)">Nagad</div></div>
    <input id="wNum" class="input" placeholder="Number দাও">
    <input id="wAmt" class="input" placeholder="Amount" type="number">
    <button class="btn" style="margin-top:12px;background:#8B5CF6" onclick="doWithdraw()">Withdraw Now</button>
  </div>

  <div class="glass" style="background:linear-gradient(90deg,#7C5CFF,#FF8C69);text-align:center">
    <b>🔥 Biggest Offer - 30 টা Ad দেখলে ৳200 Bonus!</b><br>
    <div style="margin:6px 0"><span id="ads2">22</span>/30 Completed - <span id="earnedTotal">৳0.00</span></div>
    <button class="btn" style="background:#fff;color:#000" onclick="doSponsorClaim()">🚀 Claim Now - ৳200</button>
  </div>
</div>

<!-- TASKS PAGE -->
<div id="p-task" class="page">
  <div class="glass">
    <b>🎯 Tasks & Company</b><br><br>
    <div>Level: <b id="levelName">Beginner</b> - <span id="levelNum">Level 1</span></div>
    <div class="level-box"><div id="levelFill" class="level-fill" style="width:20%"></div></div>
    <div id="lvlPer" style="font-size:12px;margin-top:5px"></div>
    <div id="levelDetail" style="font-size:11px;color:#94a3b8;margin-top:6px"></div>
    <br>
    <button id="chkBtn" class="btn btn-g" onclick="doCheckin()">Daily Check-in - <span id="chkStatus">Ready</span></button><br><br>
    <button id="sponsorBtn" class="btn btn-o" onclick="doSponsorClaim()">Claim Sponsor</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="btm">
  <div class="on" onclick="openTab('home',this)"><span>🏠</span>Home</div>
  <div onclick="openTab('task',this)"><span>📋</span>Tasks</div>
  <div onclick="alert('Profile coming')"><span>👤</span>Profile</div>
</div>

<script>
// ঠিক করা লাইন - এখানেই ভুল ছিলো
let ADMIN=JSON.parse(localStorage.getItem('ADMIN_CFG')||'{"cPrice":0.25,"pPrice":0.2,"diamondPerAd":1,"checkinTaka":10,"checkinDiamond":20,"withdrawMin":500,"sponsorBonus":100,"telegramLink":"https://t.me/ProtidinBD"}');
let bal=parseFloat(localStorage.getItem('bal')||'157.75'),c=parseInt(localStorage.getItem('cCount')||'33'),diamond=parseInt(localStorage.getItem('diamond')||'265');

function today(){return new Date().toISOString().slice(0,10);}
function getLevel(d){if(d<=200)return{lv:1,name:"Beginner",max:200,min:0};if(d<=600)return{lv:2,name:"Bronze",max:600,min:201};if(d<=1500)return{lv:3,name:"Silver",max:1500,min:601};if(d<=3000)return{lv:4,name:"Gold",max:3000,min:1501};return{lv:5,name:"Platinum",max:6000,min:3001};}
function render(){
 if(c>30)c=30;
 document.getElementById('bal').innerText='৳'+bal.toFixed(2);
 document.getElementById('ads').innerText=c;
 document.getElementById('cCount').innerText=c+'/30';document.getElementById('pCount').innerText=c+'/30';document.getElementById('ads2').innerText=c;
 document.getElementById('diamondTotal').innerText=diamond;document.getElementById('diamondBig').innerText=diamond;
 document.getElementById('earnedTotal').innerText='৳'+(c*ADMIN.cPrice).toFixed(2);
 document.getElementById('cPriceTxt').innerText=ADMIN.cPrice;document.getElementById('pPriceTxt').innerText=ADMIN.pPrice;
 document.querySelectorAll('.wMin').forEach(e=>e.innerText=ADMIN.withdrawMin);
 let lv=getLevel(diamond);let prog=((diamond-lv.min)/(lv.max-lv.min))*100;prog=Math.min(Math.max(prog,8),100);
 document.getElementById('levelName').innerText=lv.name;document.getElementById('levelNum').innerText='Level '+lv.lv;
 document.getElementById('levelFill').style.width=prog+'%';document.getElementById('lvlPer').innerText=diamond+' / '+lv.max+' - '+Math.round(prog)+'%';
 document.getElementById('levelDetail').innerText='Level '+lv.lv+' ('+lv.name+') - '+lv.min+' থেকে '+lv.max+' Diamond। এখন '+diamond+' আছে।';
 let last=localStorage.getItem('lastCheckinDate'),s=document.getElementById('chkStatus'),b=document.getElementById('chkBtn');
 if(s&&b){if(last===today()){s.innerText='Done Today ✅';b.innerText='Done ✓';b.style.background='#334155';b.disabled=true;}else{s.innerText='Ready';b.innerText='Check-in';b.style.background='#22c55e';b.disabled=false;}}
 let cl=localStorage.getItem('sponsorClaimed'),sb=document.getElementById('sponsorBtn');
 if(sb){if(cl){sb.innerText='Done ✅ Claimed';sb.style.background='#334155';sb.disabled=true;}else{sb.innerText='Claim ৳'+ADMIN.sponsorBonus;sb.style.background='#FF9F0A';sb.disabled=false;}}
 localStorage.setItem('bal',bal);localStorage.setItem('cCount',c);localStorage.setItem('diamond',diamond);
}
function openTab(n,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+n).classList.add('active');document.querySelectorAll('.btm div').forEach(d=>d.classList.remove('on'));el.classList.add('on');window.scrollTo(0,0);}
function selMeth(e){document.querySelectorAll('.meth').forEach(m=>m.classList.remove('on'));e.classList.add('on');}
function watchAd(){
 if(c>=30){alert('Ajker 30 ta sesh! Kal abar pabe');return;}
 if(typeof show_11798857==='function'){show_11798857().then(()=>{bal+=ADMIN.cPrice;c++;diamond+=ADMIN.diamondPerAd;render();});}
 else{bal+=ADMIN.cPrice;c++;diamond+=ADMIN.diamondPerAd;render();}
}
function doCheckin(){if(localStorage.getItem('lastCheckinDate')===today()){alert('আজ Done!');return;}bal+=ADMIN.checkinTaka;diamond+=ADMIN.checkinDiamond;localStorage.setItem('lastCheckinDate',today());render();}
function doSponsorClaim(){if(localStorage.getItem('sponsorClaimed')){alert('Done!');return;}bal+=ADMIN.sponsorBonus;localStorage.setItem('sponsorClaimed','1');render();alert('✅ Sponsor Done! ৳'+ADMIN.sponsorBonus);}
function doWithdraw(){let amt=parseFloat(document.getElementById('wAmt').value);let num=document.getElementById('wNum').value;if(!amt||amt<ADMIN.withdrawMin){alert('Min ৳'+ADMIN.withdrawMin);return;}if(amt>bal){alert('Balance কম');return;}if(!num){alert('Number দাও');return;}bal-=amt;render();alert('✅ Withdraw Sent');}
function saveName(){let n=prompt('নাম লিখো:',localStorage.getItem('userName')||'Md Siblen');if(n){localStorage.setItem('userName',n);document.getElementById('userName').innerText=n;}}
render();
</script>
</body>
</html>
